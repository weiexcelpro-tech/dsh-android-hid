[env:esp32_s3_devkitc]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino
; 关键：Serial 必须走 UART0（GPIO43/44）→ 板载 CH343 → 树莓派 /dev/ttyACM0
; 若启用 ARDUINO_USB_CDC_ON_BOOT，Serial 会跑到原生 USB(OTG) 口，COM 口就没输出了
build_unflags =
    -DBOARD_HAS_PSRAM
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; 原生 USB(OTG) 枚举为 CDC 串口 → 手机 OTG 直连可发命令
    ; UART0(GPIO43/44) 仍由 logPort 独立使用，树莓派 COM 口日志不受影响
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 打字/回包用的是 notify，NimBLE 默认的 msys 缓冲块太少：
    ; 手机端（HID host + 我们 App 的 GATT client）同时订阅时，连发十几帧就会
    ; notify() 返 false —— 表现是「字符丢一半 + 回包收不到」。把池子加大。
    -DCONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=32
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=32

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini：同样跑 BLE HID，主板只有原生 USB-Serial/JTAG
;   - Serial(HWCDC) 走 USB → 树莓派 /dev/ttyACM0，同时是命令通道
;   - UART0 仍开在 GPIO20/21（板上没接也不影响）
;   - 4MB flash，用 huge_app 分区（1.2MB 的 default 对 1MB 固件太紧）
; ---------------------------------------------------------------------------
[env:esp32_c3_supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; C3 SRAM 够用（实测堆余 243KB），MSYS 与 S3 保持一致 32 —— 压到 16 时
    ; 连发触摸报文会 notify 失败（[hid] notify failed after 6 tries），表现为点不动
    -DCONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=32
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=32
